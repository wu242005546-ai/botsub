name: Daily Sub Crawl

on:
  schedule:
    # 每天 02:00 UTC = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      keywords:
        description: '覆盖搜索关键词（逗号分隔）'
        required: false
        default: ''
      debug_repos:
        description: '调试仓库白名单（逗号分隔 owner/repo）'
        required: false
        default: ''

concurrency:
  group: sub-bot-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.10'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
  QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
  QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
  TO_EMAIL: ${{ secrets.TO_EMAIL }}
  # 公开频道用户名，逗号分隔，如 "freenode_share,clashnode"；不是密钥，用 Variables 而非 Secrets 也可以
  TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS }}
  # 订阅推送目标仓库名（默认 botsub）
  SUB_REPO_NAME: ${{ vars.SUB_REPO_NAME }}
  SUB_REPO_BRANCH: ${{ vars.SUB_REPO_BRANCH }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        run: |
          KWARGS=""
          if [ -n "${{ github.event.inputs.keywords }}" ]; then
            KWARGS="$KWARGS --keywords ${{ github.event.inputs.keywords }}"
          fi
          if [ -n "${{ github.event.inputs.debug_repos }}" ]; then
            KWARGS="$KWARGS --debug-repos ${{ github.event.inputs.debug_repos }}"
          fi
          git config --global user.name "sub-bot"
          git config --global user.email "sub-bot@users.noreply.github.com"
          python main.py $KWARGS

      - name: Commit state & outputs
        if: always()
        run: |
          git pull --rebase --autostash || true
          git add output/state.db output/current output/latest || true
          for f in sub_clash.txt sub_v2ray.txt sub_nodes.txt sub_telegram.txt; do if [ -f "$f" ]; then git add "$f"; fi; done || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(subs): update subscriptions $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub-bot-output
          path: |
            output/current/*.txt
            output/latest/*.json
            output/run.log